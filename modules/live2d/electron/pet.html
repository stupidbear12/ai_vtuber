<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>에메스 데스크톱 펫</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Live2D 캔버스 — 투명 전체화면 */
  #cv {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: transparent !important;
    display: block;
  }

  /* WebSocket 연결 상태 점 (우측 상단) */
  #ws-dot {
    position: fixed;
    top: 8px; right: 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f76c6c;   /* 빨강 = 연결 끊김 */
    opacity: 0.65;
    z-index: 300;
    pointer-events: none;
    transition: background 0.4s;
  }
  #ws-dot.ok { background: #56cfb2; } /* 초록 = 연결됨 */

  /* 마우스 통과 모드 배지 (좌측 상단) */
  #through-badge {
    position: fixed;
    top: 8px; left: 8px;
    background: rgba(232, 107, 206, 0.80);
    color: #fff;
    font: 10px/1 'Segoe UI', sans-serif;
    padding: 3px 8px;
    border-radius: 5px;
    display: none;
    z-index: 300;
    pointer-events: none;
  }
  #through-badge.show { display: block; }

  /* 채팅 오버레이 (하단 중앙) */
  #chat-wrap {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    display: none;
    flex-direction: column;
    gap: 6px;
    z-index: 200;
  }
  #chat-wrap.open { display: flex; }

  /* 채팅 메시지 목록 */
  #chat-msgs {
    background: rgba(14, 14, 32, 0.88);
    border: 1px solid rgba(86, 207, 178, 0.22);
    border-radius: 12px;
    padding: 10px 12px;
    max-height: 170px;
    overflow-y: auto;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: none;
  }
  #chat-msgs.has-msgs { display: block; }

  .cm {
    font: 12px/1.6 'Segoe UI', sans-serif;
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .cm:last-child { border-bottom: none; }
  .cm.u   { color: #56cfb2; }   /* 사용자 메시지 */
  .cm.a   { color: #e0b0ff; }   /* 에메스 응답 */
  .cm.err { color: #f76c6c; font-size: 11px; }  /* 오류 */

  /* 입력 행 */
  #ci-row {
    display: flex;
    gap: 5px;
  }
  #ci {
    flex: 1;
    background: rgba(14, 14, 32, 0.92);
    border: 1px solid rgba(86, 207, 178, 0.30);
    border-radius: 8px;
    color: #e0e0e0;
    padding: 7px 10px;
    font: 12px 'Segoe UI', sans-serif;
    outline: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: border-color 0.15s;
  }
  #ci:focus       { border-color: #56cfb2; }
  #ci::placeholder { color: #484860; }
  #ci:disabled    { opacity: 0.45; }

  .cbtn {
    background: rgba(14, 14, 32, 0.92);
    border: 1px solid rgba(232, 107, 206, 0.30);
    border-radius: 8px;
    color: #e86bce;
    padding: 7px 11px;
    font: 12px 'Segoe UI', sans-serif;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background 0.15s;
    white-space: nowrap;
  }
  .cbtn:hover  { background: rgba(232, 107, 206, 0.16); }
  .cbtn:active { background: rgba(232, 107, 206, 0.28); }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="ws-dot"></div>
<div id="through-badge">통과 모드</div>

<div id="chat-wrap">
  <div id="chat-msgs"></div>
  <div id="ci-row">
    <input id="ci" type="text" placeholder="에메스에게 말을 걸어보세요 (Enter)"
           maxlength="200" autocomplete="off" spellcheck="false">
    <button class="cbtn" id="btn-send">전송</button>
    <button class="cbtn" id="btn-close">✕</button>
  </div>
</div>

<!-- PixiJS v8 -->
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<!-- Cubism Core v5 (ai_live2d FastAPI 서버에서 제공, 포트 8001) -->
<script src="http://localhost:8001/live2d/static/cubism/live2dcubismcore.min.js"></script>
<!-- pixi-live2d-display (Cubism5 + PixiJS v8) -->
<script src="https://cdn.jsdelivr.net/npm/@naari3/pixi-live2d-display@1.2.5/dist/cubism5.min.js"></script>
<!-- AnimSystem (ai_live2d 서버에서 제공) -->
<script src="http://localhost:8001/live2d/static/js/anim.js"></script>

<script>
// ── 설정 ──────────────────────────────────────────────────────
// ai_live2d 서버 포트 8001에 연결 (브라우저 뷰어와 동일 모델)
const DEFAULT_MODEL = 'models/mao_pro/runtime/mao_pro.model3.json';
const MODEL_URL = `http://localhost:8001/live2d/static/${DEFAULT_MODEL}`;
const WS_URL    = 'ws://localhost:8001/live2d/ws';

// 감정 이름 → 표정 매핑 (app.js EMOTION_TO_EXPR 와 동일)
const EMOTION_MAP = {
  neutral: 'exp_01', calm: 'exp_01', default: 'exp_01',
  happy: 'exp_04', joy: 'exp_04', smirk: 'exp_04',
  sad: 'exp_02', sadness: 'exp_02', fear: 'exp_02',
  angry: 'exp_03', anger: 'exp_03', disgust: 'exp_03',
  surprise: 'exp_04', surprised: 'exp_04',
  thinking: 'exp_05',
  excited: 'exp_04',
  worried: 'exp_02',
  love: 'exp_04',
  shy: 'exp_05',
};

// ── DOM ───────────────────────────────────────────────────────
const $cv       = document.getElementById('cv');
const $wsDot    = document.getElementById('ws-dot');
const $badge    = document.getElementById('through-badge');
const $chatWrap = document.getElementById('chat-wrap');
const $msgs     = document.getElementById('chat-msgs');
const $ci       = document.getElementById('ci');
const $send     = document.getElementById('btn-send');
const $close    = document.getElementById('btn-close');

// ── 상태 ──────────────────────────────────────────────────────
let pixiApp  = null;
let l2dModel = null;
let animSys  = null;
let chatOpen = false;
let waiting  = false;

// ── Live2D 초기화 ─────────────────────────────────────────────
async function initLive2D() {
  pixiApp = new PIXI.Application();
  await pixiApp.init({
    canvas:          $cv,
    width:           window.innerWidth,
    height:          window.innerHeight,
    backgroundAlpha: 0,      // 투명 배경
    antialias:       true,
    autoDensity:     true,
    resolution:      window.devicePixelRatio || 1,
  });

  animSys = new AnimSystem();

  // mao_pro 모델 로드 (브라우저 뷰어와 동일)
  l2dModel = await PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: false });
  pixiApp.stage.addChild(l2dModel);
  l2dModel.setRenderer(pixiApp.renderer);
  positionModel();

  // pixi-live2d-display 내부 모션 중지 — AnimSystem이 파라미터를 직접 제어
  l2dModel.internalModel.motionManager.stopAllMotions?.();

  // Cubism SDK가 마스크 렌더링 후 gl.clearColor(1,1,1,1)을 복원하지 않는 버그 수정:
  // 매 프레임 HIGH 우선순위로 clearColor를 투명으로 리셋
  pixiApp.ticker.add(() => {
    const gl = pixiApp.renderer?.gl;
    if (gl) gl.clearColor(0, 0, 0, 0);
  }, null, PIXI.UPDATE_PRIORITY.HIGH);

  // 틱마다 AnimSystem 파라미터를 Cubism Core에 주입
  pixiApp.ticker.add(() => {
    if (!l2dModel || !animSys) return;
    const params = animSys.tick();
    const core   = l2dModel.internalModel.coreModel;
    for (const [id, v] of Object.entries(params)) {
      try { core.setParameterValueById(id, v, 1.0); } catch (_) {}
    }
  });

  animSys.startIdle();

  window.addEventListener('resize', () => {
    pixiApp.renderer.resize(window.innerWidth, window.innerHeight);
    positionModel();
  });
}

// 모델 위치 조정 — 화면 하단 중앙에 꽉 차게 배치
function positionModel() {
  if (!l2dModel || !pixiApp) return;
  const { width: sw, height: sh } = pixiApp.screen;
  const { originalWidth: mw, originalHeight: mh } = l2dModel.internalModel;
  const scale = Math.min(sw / mw, sh / mh) * 0.90;
  l2dModel.scale.set(scale);
  l2dModel.anchor.set(0, 0);
  l2dModel.pivot.set(0, 0);
  l2dModel.x = sw / 2 - (mw * scale) / 2;
  l2dModel.y = sh - mh * scale;
}

// ── WebSocket (Live2D 제어 채널) ──────────────────────────────
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen    = () => { $wsDot.className = 'ok'; };
  ws.onclose   = () => { $wsDot.className = ''; setTimeout(connectWS, 3000); };
  ws.onerror   = () => { $wsDot.className = ''; };
  ws.onmessage = ({ data }) => {
    try { handleCmd(JSON.parse(data)); } catch (_) {}
  };
}

// ai_live2d 서버에서 오는 WebSocket 명령 처리
function handleCmd(msg) {
  if (!l2dModel || !animSys) return;
  switch (msg.cmd) {
    case 'set_params':
      // 파라미터 직접 주입 (예: {"ParamAngleX": 15})
      animSys.setManualParams(msg.params);
      break;
    case 'set_emotion':
      // 감정 이름 → 표정 자동 변환
      l2dModel.expression(EMOTION_MAP[msg.emotion] ?? 'exp_01');
      break;
    case 'set_expression':
      // 표정 직접 지정
      l2dModel.expression(msg.expression);
      break;
    case 'set_mouth':
      // 립싱크 값 설정
      animSys.setMouth(msg.value);
      break;
    case 'clear_mouth':
      // 립싱크 레이어 제거
      animSys.clearMouth();
      break;
    case 'reaction':
      // 반응 애니메이션 (nod/shake/surprised/superchat)
      animSys.triggerReaction(msg.name);
      break;
    case 'idle_start':
      animSys.startIdle();
      break;
    case 'idle_stop':
      animSys.stopIdle();
      break;
    case 'play_motion_once':
    case 'play_motion':
    case 'set_motion': {
      const priority = PIXI.live2d.MotionPriority?.FORCE ?? 3;
      animSys.stopIdle();
      l2dModel.internalModel.motionManager.stopAllMotions?.();
      l2dModel.motion(msg.group ?? 'Idle', msg.index ?? 0, priority);
      setTimeout(() => {
        l2dModel.internalModel.motionManager.stopAllMotions?.();
        animSys.startIdle();
      }, msg.duration ?? 5500);
      break;
    }
  }
}

// ── 채팅 UI ───────────────────────────────────────────────────
function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'cm ' + cls;
  d.textContent = text;
  $msgs.appendChild(d);
  $msgs.classList.add('has-msgs');
  $msgs.scrollTop = $msgs.scrollHeight;
  // 최대 40개 메시지 유지 (오래된 것 제거)
  while ($msgs.children.length > 40) $msgs.removeChild($msgs.firstChild);
}

function openChat() {
  chatOpen = true;
  $chatWrap.classList.add('open');
  setTimeout(() => $ci.focus(), 30);
}

function closeChat() {
  chatOpen = false;
  $chatWrap.classList.remove('open');
}

async function sendChat() {
  const msg = $ci.value.trim();
  if (!msg || waiting) return;
  $ci.value    = '';
  waiting      = true;
  $ci.disabled = true;
  addMsg('나: ' + msg, 'u');

  if (window.petAPI) {
    // Electron IPC 경로: preload → main.js → HTTP → ai_live2d FastAPI
    window.petAPI.sendChat(msg);
  } else {
    // 브라우저 직접 실행 시 폴백 (fetch)
    try {
      const res = await fetch('http://localhost:8001/live2d/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });
      handleReply(await res.json());
    } catch (e) {
      addMsg('오류: 서버에 연결할 수 없습니다', 'err');
      waiting      = false;
      $ci.disabled = false;
    }
  }
}

function handleReply(data) {
  waiting      = false;
  $ci.disabled = false;
  if (data.error && !data.reply) {
    addMsg('오류: ' + data.error, 'err');
    return;
  }
  if (data.reply) {
    addMsg('에메스: ' + data.reply, 'a');
    // 감정에 맞는 표정 변경
    if (data.emotion && l2dModel) {
      l2dModel.expression(EMOTION_MAP[data.emotion] ?? 'exp_01');
    }
  }
}

// ── Electron petAPI 콜백 등록 ─────────────────────────────────
if (window.petAPI) {
  // main.js로부터 채팅 응답 수신
  window.petAPI.onChatReply(handleReply);
  // 마우스 통과 모드 변경 알림 수신
  window.petAPI.onMouseThrough((enabled) => {
    if (enabled) $badge.classList.add('show');
    else         $badge.classList.remove('show');
  });
}

// ── 클릭 vs 드래그 구분 ───────────────────────────────────────
let mdX = 0, mdY = 0;

$cv.addEventListener('mousedown', (e) => {
  mdX = e.clientX; mdY = e.clientY;
});

$cv.addEventListener('click', (e) => {
  // Electron: preload.js의 드래그 감지 사용
  if (window.petAPI?.wasDragged()) return;
  // 폴백: 5px 이상 이동 시 드래그로 간주
  if (Math.hypot(e.clientX - mdX, e.clientY - mdY) > 5) return;

  if (chatOpen) closeChat();
  else          openChat();
});

// ── 채팅 UI 이벤트 ────────────────────────────────────────────
$send.addEventListener('click', sendChat);
$close.addEventListener('click', closeChat);

$ci.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  if (e.key === 'Escape') closeChat();
});

// 채팅 영역 mousedown이 preload 드래그로 이어지지 않도록 방지
$chatWrap.addEventListener('mousedown', (e) => e.stopPropagation(), true);

// ── 부팅 ─────────────────────────────────────────────────────
initLive2D()
  .then(() => connectWS())
  .catch((e) => {
    console.error('[Pet Boot Error]', e);
    document.body.style.background = '#1a1a2e';
    document.body.innerHTML += `<div style="color:#f76c6c;padding:20px;font:14px monospace;">
      모델 로드 실패: ${e.message}<br>
      ai_live2d 서버가 실행 중인지 확인하세요 (포트 8001)<br>
      <code>uvicorn app.main:app --port 8001</code>
    </div>`;
  });
</script>
</body>
</html>
