<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mao_pro Live2D Viewer</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #1a1a2e;
      --panel:   #16213e;
      --card:    #0f3460;
      --accent:  #e86bce;
      --accent2: #56cfb2;
      --text:    #e0e0e0;
      --muted:   #888;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }

    /* 투명 모드 (OBS / Electron) */
    html.transparent, body.transparent {
      background: transparent;
      -webkit-app-region: drag;
    }
    body.transparent #panel { display: none; }
    body.chromakey { background: #00FF00 !important; }
    body.chromakey #canvas-wrap { background: #00FF00 !important; }
    body.transparent #canvas-wrap { background: transparent !important; }
    body.transparent #live2d-canvas { background: transparent !important; }
    body.transparent #live2d-canvas { -webkit-app-region: no-drag; background: transparent; }

    /* 캔버스 영역 */
    #canvas-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    #live2d-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 사이드 패널 */
    #panel {
      width: 270px;
      min-width: 270px;
      background: var(--panel);
      border-left: 1px solid #2a2a4a;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    h2 {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .dot.connected { background: var(--accent2); }
    .dot.error     { background: #f76c6c; }

    .slider-row { margin-top: 7px; }
    .slider-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 2px;
    }
    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 5px 11px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.15); }
    button.sec {
      background: #2a2a4a;
    }
    button.sec:hover { background: #3a3a5a; filter: none; }

    input[type=text] {
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #3a3a5a;
      color: var(--text);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 11px;
      margin-top: 6px;
      font-family: monospace;
    }

    #log {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      max-height: 90px;
      overflow-y: auto;
      line-height: 1.5;
    }
    #log div { border-bottom: 1px solid #1a1a2e; padding: 1px 0; }
  </style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="live2d-canvas"></canvas>
</div>

<div id="panel">

  <div class="card">
    <h2>상태</h2>
    <div class="status-row">
      <div class="dot" id="ws-dot"></div>
      <span id="ws-label">서버 미연결</span>
    </div>
    <div class="status-row">
      <div class="dot" id="model-dot"></div>
      <span id="model-label">모델 없음</span>
    </div>
  </div>

  <div class="card">
    <h2>모델</h2>
    <input type="text" id="model-path" placeholder="models/mao_pro/runtime/mao_pro.model3.json">
    <div class="btn-row" style="margin-top:6px">
      <button id="btn-load">로드</button>
    </div>
  </div>

  <div class="card">
    <h2>파라미터 수동 제어</h2>
    <div class="slider-row">
      <div class="slider-label"><span>고개 X</span><span id="v-angle-x">0</span></div>
      <input type="range" id="s-angle-x" min="-30" max="30" value="0" step="0.5">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>고개 Y</span><span id="v-angle-y">0</span></div>
      <input type="range" id="s-angle-y" min="-30" max="30" value="0" step="0.5">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>고개 Z</span><span id="v-angle-z">0</span></div>
      <input type="range" id="s-angle-z" min="-30" max="30" value="0" step="0.5">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>눈 (왼)</span><span id="v-eye-l">1.00</span></div>
      <input type="range" id="s-eye-l" min="0" max="1" value="1" step="0.01">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>눈 (오른)</span><span id="v-eye-r">1.00</span></div>
      <input type="range" id="s-eye-r" min="0" max="1" value="1" step="0.01">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>입 (A)</span><span id="v-mouth-a">0.00</span></div>
      <input type="range" id="s-mouth-a" min="0" max="1" value="0" step="0.01">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>볼 붉힘</span><span id="v-cheek">0.00</span></div>
      <input type="range" id="s-cheek" min="0" max="1" value="0" step="0.01">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>호흡</span><span id="v-breath">0.00</span></div>
      <input type="range" id="s-breath" min="0" max="1" value="0" step="0.01">
    </div>
  </div>

  <div class="card">
    <h2>자동 애니메이션</h2>
    <div class="btn-row">
      <button id="btn-idle">Idle 시작</button>
      <button id="btn-stop" class="sec">정지</button>
    </div>
  </div>

  <div class="card">
    <h2>표정 (Expression)</h2>
    <div class="btn-row">
      <button class="sec" data-expr="exp_01">exp1 기본</button>
      <button class="sec" data-expr="exp_02">exp2 미소</button>
      <button class="sec" data-expr="exp_03">exp3</button>
      <button class="sec" data-expr="exp_04">exp4 기쁨</button>
    </div>
    <div class="btn-row">
      <button class="sec" data-expr="exp_05">exp5</button>
      <button class="sec" data-expr="exp_06">exp6</button>
      <button class="sec" data-expr="exp_07">exp7</button>
      <button class="sec" data-expr="exp_08">exp8</button>
    </div>
  </div>

  <div class="card">
    <h2>모션 재생</h2>
    <div class="btn-row">
      <button class="sec" data-motion-group="Idle" data-motion-index="0">Idle</button>
      <button class="sec" data-motion-group="" data-motion-index="0">mtn_02</button>
      <button class="sec" data-motion-group="" data-motion-index="1">mtn_03</button>
      <button class="sec" data-motion-group="" data-motion-index="2">mtn_04</button>
    </div>
    <div class="btn-row">
      <button class="sec" data-motion-group="" data-motion-index="3">special_01</button>
      <button class="sec" data-motion-group="" data-motion-index="4">special_02</button>
      <button class="sec" data-motion-group="" data-motion-index="5">special_03</button>
    </div>
  </div>

  <div class="card">
    <h2>반응 애니메이션</h2>
    <div class="btn-row">
      <button class="sec" data-reaction="nod">끄덕임</button>
      <button class="sec" data-reaction="shake">고개젓기</button>
      <button class="sec" data-reaction="surprised">놀람</button>
      <button class="sec" data-reaction="superchat">슈퍼챗</button>
    </div>
  </div>

  <div class="card">
    <h2>로그</h2>
    <div id="log"></div>
  </div>

</div>

<!-- PixiJS v8 -->
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<!-- Cubism Core v5 -->
<script src="cubism/live2dcubismcore.min.js"></script>
<!-- pixi-live2d-display (Cubism5 + PixiJS v8) -->
<script src="https://cdn.jsdelivr.net/npm/@naari3/pixi-live2d-display@1.2.5/dist/cubism5.min.js"></script>

<script src="js/anim.js"></script>
<script src="js/ws_client.js"></script>
<script src="js/app.js"></script>

</body>
</html>
