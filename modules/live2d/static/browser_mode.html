<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sion Browser Mode - Live2D Overlay</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    /* Live2D 캔버스 — 우측 하단 고정 */
    #canvas-wrap {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 35%;      /* 화면의 35% */
      height: 60%;     /* 상반신만 보이도록 */
      z-index: 100;
      pointer-events: none;
    }

    #live2d-canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    /* 자막 — 하단 중앙 */
    @keyframes subtitleFadeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes subtitleFadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
  </style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="live2d-canvas"></canvas>
</div>

<!-- PixiJS v8 -->
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<!-- Cubism Core v5 -->
<script src="cubism/live2dcubismcore.min.js"></script>
<!-- pixi-live2d-display (Cubism5 + PixiJS v8) -->
<script src="https://cdn.jsdelivr.net/npm/@naari3/pixi-live2d-display@1.2.5/dist/cubism5.min.js"></script>

<script src="js/anim.js?v=3"></script>
<script src="js/ws_client.js?v=3"></script>

<script>
// ── browser_mode app.js — 우측 하단 오버레이 전용 ──────────────────

const DEFAULT_MODEL = 'models/mao_pro/runtime/mao_pro.model3.json';

const EMOTION_TO_EXPR = {
  neutral: 'exp_01', calm: 'exp_01', default: 'exp_01',
  content: 'exp_02', gentle: 'exp_02',
  sad: 'exp_03',     sadness: 'exp_03', fear: 'exp_03',
  happy: 'exp_04',   joy: 'exp_04', excited: 'exp_04',
  annoyed: 'exp_05', frustrated: 'exp_05', thinking: 'exp_05',
  embarrassed: 'exp_06', shy: 'exp_06', flustered: 'exp_06',
  surprise: 'exp_07', surprised: 'exp_07', shocked: 'exp_07', worried: 'exp_07',
  angry: 'exp_08',   anger: 'exp_08', disgust: 'exp_08',
  smirk: 'exp_04',
};

const EMOTION_TO_MOTION = {
  happy:     { group: '', index: 0 },
  excited:   { group: '', index: 3 },
  surprised: { group: '', index: 4 },
  angry:     { group: '', index: 2 },
  shy:       { group: '', index: 1 },
};

const HIT_MOTIONS = {
  HitAreaHead: { group: '', index: 1 },
  HitAreaBody: { group: '', index: 2 },
};

let pixiApp  = null;
let l2dModel = null;
let animSys  = null;
let wsClient = null;
let motionRestoreTimer = null;
const DEFAULT_MOTION_MS = 5500;

const urlParams = new URLSearchParams(location.search);

function addLog(msg) { console.log(`[BrowserMode] ${msg}`); }
function setWsStatus(s) { console.log(`[WS] ${s}`); }
function setModelStatus(ok, text) { console.log(`[Model] ${ok ? 'OK' : 'FAIL'}: ${text}`); }

// ── PixiJS 초기화 (투명 배경) ─────────────────────────────────────
async function initPixi() {
  const wrap = document.getElementById('canvas-wrap');
  const canvas = document.getElementById('live2d-canvas');

  // WebGL 투명 컨텍스트
  canvas.getContext('webgl2', {
    alpha: true, premultipliedAlpha: false,
    antialias: true, preserveDrawingBuffer: false,
  }) || canvas.getContext('webgl', {
    alpha: true, premultipliedAlpha: false, antialias: true,
  });

  pixiApp = new PIXI.Application();
  await pixiApp.init({
    canvas,
    width:  wrap.clientWidth,
    height: wrap.clientHeight,
    background:      0x000000,
    backgroundAlpha: 0,
    antialias:       true,
    autoDensity:     true,
    resolution:      window.devicePixelRatio || 1,
    preference:      'webgl',
  });

  canvas.style.background = 'transparent';

  window.addEventListener('resize', () => {
    pixiApp.renderer.resize(wrap.clientWidth, wrap.clientHeight);
    if (l2dModel) positionModel();
  });
}

// ── 모델 배치 (우측 하단, 상반신) ─────────────────────────────────
function positionModel() {
  const { width: sw, height: sh } = pixiApp.screen;
  const dpr = window.devicePixelRatio || 1;
  const { originalWidth: mw, originalHeight: mh } = l2dModel.internalModel;

  // 상반신만 보이도록 스케일 조정
  // 캔버스가 이미 화면의 35%x60%이므로 캔버스에 꽉 차게
  const scale = Math.min(sw / mw, sh / mh) * 1.3;

  l2dModel.scale.set(scale);
  l2dModel.anchor.set(0, 0);
  l2dModel.pivot.set(0, 0);

  // 모델을 우측 정렬, 하단은 캔버스 아래로 밀어서 상반신만 노출
  const modelW = mw * scale;
  const modelH = mh * scale;
  l2dModel.x = dpr * (sw / 2 - modelW / 2);
  // 하반신을 캔버스 밖으로 — 모델 높이의 30%를 아래로 밀기
  l2dModel.y = dpr * (sh - modelH * 0.7);
}

// ── 모델 로드 ────────────────────────────────────────────────────
async function loadModel(modelPath) {
  if (l2dModel) { pixiApp.stage.removeChild(l2dModel); l2dModel.destroy(); l2dModel = null; }

  addLog(`모델 로드: ${modelPath}`);
  try {
    l2dModel = await PIXI.live2d.Live2DModel.from(modelPath, { autoInteract: false });
    pixiApp.stage.addChild(l2dModel);
    l2dModel.setRenderer(pixiApp.renderer);
    positionModel();

    l2dModel.internalModel.motionManager.stopAllMotions?.();
    buildParamIndexMap();
    hookDrawForParams();

    l2dModel.on('hit', (hitAreas) => {
      for (const area of hitAreas) {
        const m = HIT_MOTIONS[area];
        if (m) { playMotion(m.group, m.index); break; }
      }
    });

    addLog('모델 로드 성공');
  } catch (e) {
    addLog(`오류: ${e.message}`);
    console.error('[Live2D]', e);
  }
}

// ── 파라미터 인덱스 맵 ──────────────────────────────────────────
let _paramIndexMap = {};

function buildParamIndexMap() {
  const core = l2dModel.internalModel.coreModel;
  const count = core.getParameterCount();
  _paramIndexMap = {};
  for (let i = 0; i < count; i++) {
    try {
      const idObj = core.getParameterId(i);
      const idStr = idObj?._id?.s;
      if (idStr) _paramIndexMap[idStr] = i;
    } catch (_) {}
  }
}

function hookDrawForParams() {
  const im = l2dModel.internalModel;
  const origDraw = im.draw.bind(im);
  im.draw = function (gl) {
    if (animSys && _paramIndexMap) {
      const merged = animSys.tick();
      const core = this.coreModel;
      for (const [id, val] of Object.entries(merged)) {
        const idx = _paramIndexMap[id];
        if (idx !== undefined) core.setParameterValueByIndex(idx, val);
      }
      core.update();
    }
    return origDraw(gl);
  };
}

// ── Expression / Emotion / Motion ──────────────────────────────
function setExpression(nameOrIndex) {
  if (!l2dModel) return;
  try { l2dModel.expression(nameOrIndex); } catch (e) { console.warn('[Expression]', e); }
}

function setEmotion(emotionName) {
  const expr = EMOTION_TO_EXPR[emotionName] ?? 'exp_01';
  setExpression(expr);
  const motion = EMOTION_TO_MOTION[emotionName];
  if (motion) playMotion(motion.group, motion.index);
}

function restoreAfterMotion() {
  if (motionRestoreTimer) { clearTimeout(motionRestoreTimer); motionRestoreTimer = null; }
  if (!l2dModel) return;
  l2dModel.internalModel.motionManager.stopAllMotions?.();
  animSys?.startIdle();
}

function playMotion(group, index, options = {}) {
  if (!l2dModel) return;
  const priority = PIXI.live2d.MotionPriority?.FORCE ?? 3;
  const durationMs = options.duration ?? DEFAULT_MOTION_MS;
  const restoreIdle = options.restoreIdle !== false;

  if (motionRestoreTimer) { clearTimeout(motionRestoreTimer); motionRestoreTimer = null; }
  animSys?.stopIdle();
  l2dModel.internalModel.motionManager.stopAllMotions?.();

  try {
    l2dModel.motion(group, index, priority);
    if (restoreIdle && durationMs > 0) {
      motionRestoreTimer = setTimeout(restoreAfterMotion, durationMs);
    }
  } catch (e) {
    console.warn('[Motion]', e);
    if (restoreIdle) animSys?.startIdle();
  }
}

// ── 진입점 ───────────────────────────────────────────────────────
async function main() {
  animSys  = new AnimSystem();
  wsClient = new Live2DWSClient(animSys, setWsStatus, addLog, setExpression, playMotion);

  await initPixi();

  const modelPath = urlParams.get('model') || DEFAULT_MODEL;
  await loadModel(modelPath);
  if (l2dModel) { animSys.startIdle(); addLog('Idle 자동 시작'); }

  wsClient.connect();
  addLog('Browser Mode 오버레이 준비 완료');
}

main().catch(console.error);
</script>

</body>
</html>
