<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>시온 vs 시청자 체스</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #fff;
  }
  .container {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  /* ── 체스판 ─────────────────── */
  .board-wrap {
    position: relative;
    background: rgba(0,0,0,0.6);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  .player-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .player-bar.top { background: rgba(100,100,255,0.3); }
  .player-bar.bottom { background: rgba(255,100,100,0.3); margin-bottom: 0; margin-top: 8px; }
  .player-bar .indicator {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
  }
  .player-bar .indicator.active { background: #0f0; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 64px);
    grid-template-rows: repeat(8, 64px);
    border: 2px solid #888;
    border-radius: 4px;
    overflow: hidden;
  }
  .sq {
    width: 64px; height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    cursor: default;
    position: relative;
    transition: background 0.2s;
  }
  .sq.light { background: #f0d9b5; }
  .sq.dark  { background: #b58863; }
  .sq.highlight { box-shadow: inset 0 0 0 3px #ff0; }
  .sq.last-move { background: rgba(255,255,0,0.35) !important; }

  /* ── 사이드 패널 ────────────── */
  .side-panel {
    background: rgba(0,0,0,0.7);
    border-radius: 12px;
    padding: 16px;
    width: 260px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  .panel-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    text-align: center;
  }

  /* 상태 */
  #phase-display {
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .phase-sion { background: rgba(255,100,100,0.4); }
  .phase-vote { background: rgba(100,200,100,0.4); }
  .phase-over { background: rgba(200,200,50,0.4); }
  .phase-idle { background: rgba(100,100,100,0.4); }

  /* 투표 현황 */
  .vote-section { margin-bottom: 12px; }
  .vote-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0;
    font-size: 14px;
  }
  .vote-bar .move-name { font-weight: 700; min-width: 50px; }
  .vote-bar .bar {
    flex: 1;
    height: 18px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
  }
  .vote-bar .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4CAF50, #8BC34A);
    border-radius: 4px;
    transition: width 0.3s;
  }
  .vote-bar .count { min-width: 24px; text-align: right; font-size: 13px; }

  /* 타이머 */
  #timer {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin: 8px 0;
    color: #4CAF50;
  }
  #timer.urgent { color: #f44336; animation: pulse 0.5s infinite; }

  /* 기보 */
  .move-log {
    max-height: 200px;
    overflow-y: auto;
    font-size: 13px;
    padding: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
  }
  .move-log .entry {
    display: flex;
    gap: 4px;
    padding: 2px 0;
  }
  .move-log .num { color: #888; min-width: 28px; }
  .move-log .white-m { color: #ffc; min-width: 55px; }
  .move-log .black-m { color: #cdf; }

  /* 결과 오버레이 */
  .result-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    border-radius: 12px;
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .result-overlay.show { display: flex; }
  .result-overlay .result-text {
    font-size: 32px;
    font-weight: 800;
  }
  .result-overlay .result-sub { font-size: 16px; color: #aaa; }
</style>
</head>
<body>

<div class="container">
  <!-- 체스판 -->
  <div class="board-wrap">
    <div class="player-bar top">
      <div class="indicator" id="ind-top"></div>
      <span id="name-top">시청자 연합</span>
    </div>
    <div id="board"></div>
    <div class="player-bar bottom">
      <div class="indicator" id="ind-bottom"></div>
      <span id="name-bottom">시온 (AI)</span>
    </div>
    <div class="result-overlay" id="result-overlay">
      <div class="result-text" id="result-text"></div>
      <div class="result-sub" id="result-sub"></div>
    </div>
  </div>

  <!-- 사이드 패널 -->
  <div class="side-panel">
    <div class="panel-title">시온 vs 시청자</div>
    <div id="phase-display" class="phase-idle">대기 중</div>
    <div id="timer"></div>

    <div class="vote-section" id="vote-section" style="display:none;">
      <div style="font-size:13px; color:#aaa; margin-bottom:4px;">채팅에 <b>!수 e4</b> 로 투표하세요</div>
      <div id="vote-bars"></div>
    </div>

    <div class="panel-title" style="font-size:14px; margin-top:12px;">기보</div>
    <div class="move-log" id="move-log"></div>
  </div>
</div>

<script>
const PIECE_UNICODE = {
  'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
  'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟',
};

const boardEl = document.getElementById('board');
const phaseEl = document.getElementById('phase-display');
const timerEl = document.getElementById('timer');
const voteSectionEl = document.getElementById('vote-section');
const voteBarsEl = document.getElementById('vote-bars');
const moveLogEl = document.getElementById('move-log');
const resultOverlay = document.getElementById('result-overlay');
const resultText = document.getElementById('result-text');
const resultSub = document.getElementById('result-sub');
const indTop = document.getElementById('ind-top');
const indBottom = document.getElementById('ind-bottom');

let currentState = null;
let timerInterval = null;

// ── 체스판 렌더 ──────────────────
function renderBoard(fen, lastMoveUci) {
  boardEl.innerHTML = '';
  const rows = fen.split(' ')[0].split('/');
  const lastFrom = lastMoveUci ? lastMoveUci.slice(0,2) : null;
  const lastTo = lastMoveUci ? lastMoveUci.slice(2,4) : null;

  for (let r = 0; r < 8; r++) {
    let col = 0;
    for (const ch of rows[r]) {
      if (ch >= '1' && ch <= '8') {
        for (let i = 0; i < parseInt(ch); i++) {
          addSquare(r, col, null, lastFrom, lastTo);
          col++;
        }
      } else {
        addSquare(r, col, ch, lastFrom, lastTo);
        col++;
      }
    }
  }
}

function addSquare(row, col, piece, lastFrom, lastTo) {
  const sq = document.createElement('div');
  const isLight = (row + col) % 2 === 0;
  sq.className = 'sq ' + (isLight ? 'light' : 'dark');

  const file = String.fromCharCode(97 + col);
  const rank = String(8 - row);
  const pos = file + rank;

  if (pos === lastFrom || pos === lastTo) {
    sq.classList.add('last-move');
  }

  if (piece) {
    sq.textContent = PIECE_UNICODE[piece] || piece;
  }
  boardEl.appendChild(sq);
}

// ── 상태 업데이트 ────────────────
function updateUI(state) {
  currentState = state;

  // 체스판
  const lastUci = state.last_move ? state.last_move.uci : null;
  renderBoard(state.fen, lastUci);

  // 턴 인디케이터
  indTop.className = 'indicator' + (!state.is_sion_turn ? ' active' : '');
  indBottom.className = 'indicator' + (state.is_sion_turn ? ' active' : '');

  // 페이즈 표시
  switch (state.phase) {
    case 'sion_turn':
      phaseEl.textContent = '시온 생각 중...';
      phaseEl.className = 'phase-sion';
      voteSectionEl.style.display = 'none';
      timerEl.textContent = '';
      break;
    case 'vote_open':
      phaseEl.textContent = '시청자 투표 중!';
      phaseEl.className = 'phase-vote';
      voteSectionEl.style.display = 'block';
      startTimer(state.vote_remaining_sec);
      break;
    case 'game_over':
      phaseEl.textContent = '게임 종료';
      phaseEl.className = 'phase-over';
      voteSectionEl.style.display = 'none';
      timerEl.textContent = '';
      showResult(state.result);
      break;
    default:
      phaseEl.textContent = '대기 중';
      phaseEl.className = 'phase-idle';
      voteSectionEl.style.display = 'none';
      timerEl.textContent = '';
  }
}

function showResult(result) {
  resultOverlay.classList.add('show');
  if (result === 'sion_win') {
    resultText.textContent = '시온 승리!';
    resultText.style.color = '#ff6b6b';
    resultSub.textContent = '시온이 시청자를 이겼습니다';
  } else if (result === 'viewer_win') {
    resultText.textContent = '시청자 승리!';
    resultText.style.color = '#69db7c';
    resultSub.textContent = '시청자 연합이 시온을 이겼습니다';
  } else {
    resultText.textContent = '무승부!';
    resultText.style.color = '#ffd43b';
    resultSub.textContent = '명승부였습니다';
  }
}

// ── 타이머 ───────────────────────
function startTimer(sec) {
  if (timerInterval) clearInterval(timerInterval);
  let remaining = Math.max(0, Math.ceil(sec));

  const update = () => {
    timerEl.textContent = remaining + '초';
    timerEl.className = remaining <= 5 ? 'urgent' : '';
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerEl.textContent = '마감!';
    }
    remaining--;
  };
  update();
  timerInterval = setInterval(update, 1000);
}

// ── 투표 현황 ────────────────────
function updateVotes(data) {
  if (!data || !data.moves) return;
  voteBarsEl.innerHTML = '';
  const maxVotes = Math.max(1, ...data.moves.map(m => m.votes));

  for (const m of data.moves.slice(0, 5)) {
    const bar = document.createElement('div');
    bar.className = 'vote-bar';
    bar.innerHTML = `
      <span class="move-name">${m.san}</span>
      <div class="bar"><div class="bar-fill" style="width:${(m.votes/maxVotes)*100}%"></div></div>
      <span class="count">${m.votes}</span>
    `;
    voteBarsEl.appendChild(bar);
  }
}

// ── 기보 ─────────────────────────
function updateMoveLog(moves) {
  moveLogEl.innerHTML = '';
  for (let i = 0; i < moves.length; i += 2) {
    const num = Math.floor(i/2) + 1;
    const entry = document.createElement('div');
    entry.className = 'entry';
    let html = `<span class="num">${num}.</span>`;
    html += `<span class="white-m">${moves[i].san}</span>`;
    if (moves[i+1]) {
      html += `<span class="black-m">${moves[i+1].san}</span>`;
    }
    entry.innerHTML = html;
    moveLogEl.appendChild(entry);
  }
  moveLogEl.scrollTop = moveLogEl.scrollHeight;
}

// ── WebSocket ────────────────────
let ws = null;
let reconnectTimer = null;

function connect() {
  const host = location.hostname || 'localhost';
  const port = location.port || '8008';
  ws = new WebSocket(`ws://${host}:${port}/chess/ws`);

  ws.onopen = () => {
    console.log('[Chess WS] connected');
    if (reconnectTimer) { clearInterval(reconnectTimer); reconnectTimer = null; }
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    console.log('[Chess WS]', msg.event, msg);

    if (msg.state) {
      updateUI(msg.state);
      if (msg.state.last_move) {
        // 기보 갱신을 위해 fetch
        fetchMoveLog();
      }
    }
    if (msg.event === 'vote') {
      fetchVotes();
    }
  };

  ws.onclose = () => {
    console.log('[Chess WS] disconnected, reconnecting...');
    if (!reconnectTimer) {
      reconnectTimer = setInterval(connect, 3000);
    }
  };
}

async function fetchVotes() {
  try {
    const r = await fetch('/chess/votes');
    const data = await r.json();
    updateVotes(data);
  } catch(e) {}
}

async function fetchMoveLog() {
  try {
    const r = await fetch('/chess/state');
    const state = await r.json();
    // state doesn't have full move_history in the dict, so we track locally
  } catch(e) {}
}

// 초기 빈 체스판
renderBoard('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', null);
connect();

// 투표 현황 주기적 갱신
setInterval(() => {
  if (currentState && currentState.phase === 'vote_open') {
    fetchVotes();
  }
}, 3000);
</script>
</body>
</html>
