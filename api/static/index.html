<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>emeth 버튜버 파이프라인</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2e3148;
      --accent: #7c6af7;
      --accent2: #56cfb2;
      --danger: #f77c7c;
      --text: #e4e6f1;
      --text-muted: #7b7fa3;
      --success: #56cfb2;
      --warning: #f7c97c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    header p { color: var(--text-muted); font-size: 0.9rem; }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    /* 입력 폼 */
    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input[type="text"], select {
      flex: 1;
      min-width: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }
    input[type="text"]::placeholder { color: var(--text-muted); }

    /* 버튼 */
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.88; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-tts     { background: var(--accent2); color: #0f1117; }
    .btn-full    {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      flex: 1;
    }

    /* 상태 바 */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: background 0.3s;
    }
    .status-idle     { background: rgba(123,127,163,0.15); color: var(--text-muted); }
    .status-running  { background: rgba(124,106,247,0.15); color: var(--accent); }
    .status-completed{ background: rgba(86,207,178,0.15); color: var(--success); }
    .status-error    { background: rgba(247,124,124,0.15); color: var(--danger); }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 대본 미리보기 */
    #script-preview {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.88rem;
      line-height: 1.7;
      white-space: pre-wrap;
      max-height: 320px;
      overflow-y: auto;
      color: var(--text);
      min-height: 60px;
    }
    #script-preview.placeholder { color: var(--text-muted); font-style: italic; }

    /* 결과 패널 */
    .result-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }
    .result-label {
      color: var(--text-muted);
      min-width: 80px;
      flex-shrink: 0;
    }
    .result-value { color: var(--text); word-break: break-all; }

    /* 로그 */
    #log-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.82rem;
      font-family: 'Consolas', monospace;
      color: var(--text-muted);
      max-height: 180px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .log-ok   { color: var(--success); }
    .log-err  { color: var(--danger); }
    .log-info { color: var(--accent); }

    /* 오디오 플레이어 */
    audio {
      width: 100%;
      margin-top: 8px;
      border-radius: 6px;
    }

    /* 음성 옵션 토글 */
    .options-toggle {
      color: var(--text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      user-select: none;
      margin-top: 10px;
      display: inline-block;
    }
    .options-toggle:hover { color: var(--accent); }
    #adv-options { display: none; margin-top: 12px; }
    #adv-options.open { display: flex; flex-wrap: wrap; gap: 10px; }

    label { font-size: 0.82rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .field { flex: 1; min-width: 140px; }
  </style>
</head>
<body>

<header>
  <h1>✦ emeth 파이프라인</h1>
  <p>Ollama 대본 생성 + Edge TTS 음성 변환 자동화</p>
</header>

<div class="container">

  <!-- ── 입력 카드 ── -->
  <div class="card">
    <h2>📝 주제 입력</h2>
    <div class="input-row">
      <input type="text" id="topic-input"
        placeholder="예: 시편 23편과 함께하는 새벽 lofi"
        value="시편 23편과 함께하는 새벽 lofi" />
    </div>

    <!-- 고급 옵션 -->
    <span class="options-toggle" onclick="toggleOptions()">⚙ 음성 옵션 ▾</span>
    <div id="adv-options">
      <div class="field">
        <label>음성 (Voice)</label>
        <select id="voice-select">
          <option value="ko-KR-SunHiNeural">SunHi — 차분·표준 (권장)</option>
          <option value="ko-KR-SeoHyeonNeural">SeoHyeon — 부드럽고 서정적</option>
          <option value="ko-KR-YuJinNeural">YuJin — 따뜻하고 친근함</option>
          <option value="ko-KR-InJoonNeural">InJoon — 남성·안정적</option>
          <option value="ko-KR-GookMinNeural">GookMin — 남성·낮고 차분함</option>
        </select>
      </div>
      <div class="field">
        <label>속도 (Rate)</label>
        <select id="rate-select">
          <option value="-10%">-10% (느리게)</option>
          <option value="-5%" selected>-5% (약간 느리게)</option>
          <option value="+0%">+0% (기본)</option>
          <option value="+10%">+10% (약간 빠르게)</option>
        </select>
      </div>
      <div class="field">
        <label>모델 (Ollama)</label>
        <input type="text" id="model-input" placeholder="emeth (기본값)" />
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="runGenerateScript()">📄 대본 생성</button>
      <button class="btn-tts" onclick="runGenerateTTS()">🔊 음성 변환</button>
      <button class="btn-full" onclick="runPipeline()">⚡ 전체 실행</button>
    </div>
  </div>

  <!-- ── 상태 카드 ── -->
  <div class="card">
    <h2>🔄 진행 상태</h2>
    <div id="status-bar" class="status-idle">
      <span id="status-icon">○</span>
      <span id="status-text">대기 중</span>
    </div>
  </div>

  <!-- ── 대본 미리보기 카드 ── -->
  <div class="card">
    <h2>📖 대본 미리보기</h2>
    <div id="script-preview" class="placeholder">대본이 여기 표시됩니다...</div>
  </div>

  <!-- ── 결과 카드 ── -->
  <div class="card" id="result-card" style="display:none">
    <h2>✅ 결과</h2>
    <div id="result-items"></div>
    <div id="audio-player-wrap" style="display:none">
      <audio id="audio-player" controls></audio>
    </div>
  </div>

  <!-- ── 로그 카드 ── -->
  <div class="card">
    <h2>📋 로그</h2>
    <div id="log-box"><span class="log-info">준비 완료. 주제를 입력하고 실행하세요.</span></div>
  </div>

</div>

<script>
  const API = '';  // 같은 origin (http://localhost:8000)

  // ── 유틸 ────────────────────────────────────────────────────
  function log(msg, cls = '') {
    const box = document.getElementById('log-box');
    const t = new Date().toLocaleTimeString('ko-KR');
    const span = document.createElement('span');
    span.className = cls;
    span.textContent = `[${t}] ${msg}`;
    box.appendChild(document.createTextNode('\n'));
    box.appendChild(span);
    box.scrollTop = box.scrollHeight;
  }

  function setStatus(state, text) {
    const bar = document.getElementById('status-bar');
    const icon = document.getElementById('status-icon');
    const label = document.getElementById('status-text');

    bar.className = 'status-' + state;
    label.textContent = text;

    if (state === 'running') {
      const spinner = document.createElement('span');
      spinner.className = 'spinner';
      icon.replaceWith(spinner);
      spinner.id = 'status-icon';
    } else {
      const dot = document.createElement('span');
      dot.id = 'status-icon';
      dot.textContent = state === 'completed' ? '✓' : state === 'error' ? '✗' : '○';
      icon.replaceWith(dot);
    }
  }

  function setButtons(disabled) {
    document.querySelectorAll('button').forEach(b => b.disabled = disabled);
  }

  function showResult(items) {
    const card = document.getElementById('result-card');
    const container = document.getElementById('result-items');
    container.innerHTML = '';
    card.style.display = 'block';
    for (const [label, value] of items) {
      container.innerHTML += `
        <div class="result-item">
          <span class="result-label">${label}</span>
          <span class="result-value">${value}</span>
        </div>`;
    }
  }

  function showAudio(path) {
    const wrap = document.getElementById('audio-player-wrap');
    const player = document.getElementById('audio-player');
    // 로컬 파일은 직접 재생 불가 — 경로만 표시
    wrap.style.display = 'none';
    log(`🎵 오디오 저장: ${path}`, 'log-ok');
  }

  function getOptions() {
    return {
      voice: document.getElementById('voice-select').value,
      rate: document.getElementById('rate-select').value,
      model: document.getElementById('model-input').value.trim() || null,
    };
  }

  function toggleOptions() {
    const el = document.getElementById('adv-options');
    el.classList.toggle('open');
  }

  // ── API 호출 ─────────────────────────────────────────────────
  async function post(endpoint, body) {
    const res = await fetch(API + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || res.statusText);
    }
    return res.json();
  }

  // ── 대본 생성 ────────────────────────────────────────────────
  async function runGenerateScript() {
    const topic = document.getElementById('topic-input').value.trim();
    if (!topic) { alert('주제를 입력해주세요.'); return; }
    const { model } = getOptions();

    setButtons(true);
    setStatus('running', '대본 생성 중...');
    log(`대본 생성 시작 — "${topic}"`, 'log-info');

    try {
      const data = await post('/generate-script', { topic, model });
      setStatus('completed', '대본 생성 완료');
      log(`대본 생성 완료 (${data.char_count}자)`, 'log-ok');

      const preview = document.getElementById('script-preview');
      preview.textContent = data.script;
      preview.classList.remove('placeholder');

      showResult([
        ['주제', data.topic],
        ['글자 수', `${data.char_count}자`],
        ['저장 경로', data.file_path],
      ]);
    } catch (e) {
      setStatus('error', '오류 발생');
      log(`오류: ${e.message}`, 'log-err');
    } finally {
      setButtons(false);
    }
  }

  // ── TTS 변환 ─────────────────────────────────────────────────
  async function runGenerateTTS() {
    const preview = document.getElementById('script-preview');
    const text = preview.classList.contains('placeholder') ? '' : preview.textContent.trim();

    if (!text) {
      alert('먼저 대본을 생성하거나 위 미리보기 영역에 텍스트를 붙여넣어 주세요.');
      return;
    }
    const { voice, rate } = getOptions();

    setButtons(true);
    setStatus('running', 'TTS 변환 중...');
    log(`TTS 변환 시작 — 음성: ${voice}`, 'log-info');

    try {
      const data = await post('/generate-tts', { text, voice, rate });
      setStatus('completed', 'TTS 변환 완료');
      log(`TTS 완료 (${data.file_size_kb} KB)`, 'log-ok');
      showAudio(data.audio_path);
      showResult([
        ['음성', data.voice],
        ['파일 크기', `${data.file_size_kb} KB`],
        ['저장 경로', data.audio_path],
      ]);
    } catch (e) {
      setStatus('error', '오류 발생');
      log(`오류: ${e.message}`, 'log-err');
    } finally {
      setButtons(false);
    }
  }

  // ── 전체 파이프라인 ──────────────────────────────────────────
  async function runPipeline() {
    const topic = document.getElementById('topic-input').value.trim();
    if (!topic) { alert('주제를 입력해주세요.'); return; }
    const { voice, rate, model } = getOptions();

    setButtons(true);
    setStatus('running', '파이프라인 실행 중...');
    log(`전체 파이프라인 시작 — "${topic}"`, 'log-info');

    // 상태 폴링
    const pollInterval = setInterval(async () => {
      try {
        const s = await fetch(API + '/status').then(r => r.json());
        if (s.step) {
          document.getElementById('status-text').textContent = s.step;
        }
      } catch {}
    }, 2000);

    try {
      const data = await post('/run-pipeline', { topic, voice, rate, model });
      clearInterval(pollInterval);

      setStatus('completed', '파이프라인 완료! 🎉');
      log(`파이프라인 완료 — 대본 ${data.char_count}자 / 오디오 ${data.file_size_kb}KB`, 'log-ok');

      const preview = document.getElementById('script-preview');
      preview.textContent = data.script;
      preview.classList.remove('placeholder');

      showAudio(data.audio_path);
      showResult([
        ['주제', data.topic],
        ['글자 수', `${data.char_count}자`],
        ['오디오 크기', `${data.file_size_kb} KB`],
        ['대본 경로', data.script_path],
        ['오디오 경로', data.audio_path],
      ]);
    } catch (e) {
      clearInterval(pollInterval);
      setStatus('error', '파이프라인 오류');
      log(`오류: ${e.message}`, 'log-err');
    } finally {
      setButtons(false);
    }
  }
</script>
</body>
</html>
