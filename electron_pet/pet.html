<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI VTuber Desktop Pet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #cv {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: transparent !important;
    display: block;
  }

  /* ── WebSocket 상태 점 ── */
  #ws-dot {
    position: fixed;
    top: 8px; right: 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f76c6c;
    opacity: 0.65;
    z-index: 300;
    pointer-events: none;
    transition: background 0.4s;
  }
  #ws-dot.ok { background: #56cfb2; }

  /* ── 마우스 통과 배지 ── */
  #through-badge {
    position: fixed;
    top: 8px; left: 8px;
    background: rgba(232, 107, 206, 0.80);
    color: #fff;
    font: 10px/1 'Segoe UI', sans-serif;
    padding: 3px 8px;
    border-radius: 5px;
    display: none;
    z-index: 300;
    pointer-events: none;
  }
  #through-badge.show { display: block; }

  /* ── 채팅 오버레이 ── */
  #chat-wrap {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    display: none;
    flex-direction: column;
    gap: 6px;
    z-index: 200;
  }
  #chat-wrap.open { display: flex; }

  #chat-msgs {
    background: rgba(14, 14, 32, 0.88);
    border: 1px solid rgba(86, 207, 178, 0.22);
    border-radius: 12px;
    padding: 10px 12px;
    max-height: 170px;
    overflow-y: auto;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: none;
  }
  #chat-msgs.has-msgs { display: block; }

  .cm {
    font: 12px/1.6 'Segoe UI', sans-serif;
    padding: 2px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .cm:last-child { border-bottom: none; }
  .cm.u  { color: #56cfb2; }
  .cm.a  { color: #e0b0ff; }
  .cm.err{ color: #f76c6c; font-size: 11px; }

  /* 입력 행 */
  #ci-row {
    display: flex;
    gap: 5px;
  }
  #ci {
    flex: 1;
    background: rgba(14, 14, 32, 0.92);
    border: 1px solid rgba(86, 207, 178, 0.30);
    border-radius: 8px;
    color: #e0e0e0;
    padding: 7px 10px;
    font: 12px 'Segoe UI', sans-serif;
    outline: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: border-color 0.15s;
  }
  #ci:focus  { border-color: #56cfb2; }
  #ci::placeholder { color: #484860; }
  #ci:disabled { opacity: 0.45; }

  .cbtn {
    background: rgba(14, 14, 32, 0.92);
    border: 1px solid rgba(232, 107, 206, 0.30);
    border-radius: 8px;
    color: #e86bce;
    padding: 7px 11px;
    font: 12px 'Segoe UI', sans-serif;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background 0.15s;
    white-space: nowrap;
  }
  .cbtn:hover { background: rgba(232, 107, 206, 0.16); }
  .cbtn:active { background: rgba(232, 107, 206, 0.28); }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="ws-dot"></div>
<div id="through-badge">통과 모드</div>

<div id="chat-wrap">
  <div id="chat-msgs"></div>
  <div id="ci-row">
    <input id="ci" type="text" placeholder="emeth에게 말을 걸어보세요 (Enter)" maxlength="200" autocomplete="off" spellcheck="false">
    <button class="cbtn" id="btn-send">전송</button>
    <button class="cbtn" id="btn-close">✕</button>
  </div>
</div>

<!-- PixiJS v8 -->
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<!-- Cubism Core v5 (live2d_web 서버에서 제공) -->
<script src="http://localhost:8000/live2d/static/cubism/live2dcubismcore.min.js"></script>
<!-- pixi-live2d-display (Cubism5 + PixiJS v8) -->
<script src="https://cdn.jsdelivr.net/npm/@naari3/pixi-live2d-display@1.2.5/dist/cubism5.min.js"></script>
<!-- AnimSystem (live2d_web/js/anim.js 재사용) -->
<script src="http://localhost:8000/live2d/static/js/anim.js"></script>

<script>
// ── 설정 ──────────────────────────────────────────────────────
const MODEL_URL = 'http://localhost:8000/live2d/static/models/mao_pro/runtime/mao_pro.model3.json';
const WS_URL    = 'ws://localhost:8000/live2d/ws';

const EMOTION_MAP = {
  neutral: 'exp_01', calm: 'exp_01', default: 'exp_01',
  happy:   'exp_04', joy:  'exp_04',
  sad:     'exp_02', fear: 'exp_02',
  angry:   'exp_03',
  surprise: 'exp_04', surprised: 'exp_04',
  thinking: 'exp_05',
};

// ── DOM ───────────────────────────────────────────────────────
const $cv       = document.getElementById('cv');
const $wsDot    = document.getElementById('ws-dot');
const $badge    = document.getElementById('through-badge');
const $chatWrap = document.getElementById('chat-wrap');
const $msgs     = document.getElementById('chat-msgs');
const $ci       = document.getElementById('ci');
const $send     = document.getElementById('btn-send');
const $close    = document.getElementById('btn-close');

// ── 상태 ──────────────────────────────────────────────────────
let pixiApp  = null;
let l2dModel = null;
let animSys  = null;
let chatOpen = false;
let waiting  = false;

// ── Live2D 초기화 ─────────────────────────────────────────────
async function initLive2D() {
  // WebGL context를 투명(alpha:true)으로 미리 생성 — PixiJS가 재사용
  $cv.getContext('webgl2', { alpha: true, premultipliedAlpha: false, antialias: true }) ||
  $cv.getContext('webgl',  { alpha: true, premultipliedAlpha: false, antialias: true });

  pixiApp = new PIXI.Application();
  await pixiApp.init({
    canvas:          $cv,
    width:           window.innerWidth,
    height:          window.innerHeight,
    backgroundAlpha: 0,         // 완전 투명
    antialias:       true,
    autoDensity:     true,
    resolution:      window.devicePixelRatio || 1,
  });
  $cv.style.cssText += ';background:transparent!important;';

  animSys = new AnimSystem();

  l2dModel = await PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: true });
  pixiApp.stage.addChild(l2dModel);
  l2dModel.setRenderer(pixiApp.renderer);
  positionModel();

  // pixi-live2d-display 내부 모션 중지 — AnimSystem이 파라미터를 직접 제어
  l2dModel.internalModel.motionManager.stopAllMotions?.();

  // 틱마다 AnimSystem 파라미터를 Cubism Core에 주입
  pixiApp.ticker.add(() => {
    if (!l2dModel || !animSys) return;
    const params = animSys.tick();
    const core   = l2dModel.internalModel.coreModel;
    for (const [id, v] of Object.entries(params)) {
      try { core.setParameterValueById(id, v, 1.0); } catch (_) {}
    }
  });

  animSys.startIdle();

  window.addEventListener('resize', () => {
    pixiApp.renderer.resize(window.innerWidth, window.innerHeight);
    positionModel();
  });
}

function positionModel() {
  if (!l2dModel || !pixiApp) return;
  const { width: sw, height: sh } = pixiApp.screen;
  const dpr = window.devicePixelRatio || 1;
  const { originalWidth: mw, originalHeight: mh } = l2dModel.internalModel;
  const scale = Math.min(sw / mw, sh / mh) * 0.90;
  l2dModel.scale.set(scale);
  l2dModel.anchor.set(0, 0);
  l2dModel.pivot.set(0, 0);
  l2dModel.x = dpr * (sw / 2 - (mw * scale) / 2);
  l2dModel.y = dpr * (sh - mh * scale);
}

// ── WebSocket (Live2D 제어 채널) ──────────────────────────────
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen    = () => { $wsDot.className = 'ok'; };
  ws.onclose   = () => { $wsDot.className = ''; setTimeout(connectWS, 3000); };
  ws.onerror   = () => { $wsDot.className = ''; };
  ws.onmessage = ({ data }) => {
    try { handleCmd(JSON.parse(data)); } catch (_) {}
  };
}

function handleCmd(msg) {
  if (!l2dModel || !animSys) return;
  switch (msg.cmd) {
    case 'set_params':
      animSys.setManualParams(msg.params);
      break;
    case 'set_emotion':
      l2dModel.expression(EMOTION_MAP[msg.emotion] ?? 'exp_01');
      break;
    case 'set_expression':
      l2dModel.expression(msg.expression);
      break;
    case 'set_motion':
      l2dModel.motion(msg.group ?? '', msg.index ?? 0);
      break;
    case 'set_mouth':
      animSys.setMouth(msg.value);
      break;
    case 'clear_mouth':
      animSys.clearMouth();
      break;
    case 'reaction':
      animSys.triggerReaction(msg.name);
      break;
    case 'idle_start':
      animSys.startIdle();
      break;
    case 'idle_stop':
      animSys.stopIdle();
      break;
  }
}

// ── 채팅 UI ───────────────────────────────────────────────────
function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'cm ' + cls;
  d.textContent = text;
  $msgs.appendChild(d);
  $msgs.classList.add('has-msgs');
  $msgs.scrollTop = $msgs.scrollHeight;
  // 최대 40개 메시지 유지
  while ($msgs.children.length > 40) $msgs.removeChild($msgs.firstChild);
}

function openChat() {
  chatOpen = true;
  $chatWrap.classList.add('open');
  setTimeout(() => $ci.focus(), 30);
}

function closeChat() {
  chatOpen = false;
  $chatWrap.classList.remove('open');
}

async function sendChat() {
  const msg = $ci.value.trim();
  if (!msg || waiting) return;
  $ci.value   = '';
  waiting     = true;
  $ci.disabled = true;
  addMsg('나: ' + msg, 'u');

  if (window.petAPI) {
    // Electron IPC 경로 (main.js → HTTP → FastAPI)
    window.petAPI.sendChat(msg);
  } else {
    // 브라우저에서 직접 실행 시 폴백 (fetch)
    try {
      const res  = await fetch('http://localhost:8000/live2d/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });
      handleReply(await res.json());
    } catch (e) {
      addMsg('오류: 서버에 연결할 수 없습니다', 'err');
      waiting = false;
      $ci.disabled = false;
    }
  }
}

function handleReply(data) {
  waiting      = false;
  $ci.disabled = false;
  if (data.error && !data.reply) {
    addMsg('오류: ' + data.error, 'err');
    return;
  }
  if (data.reply) {
    addMsg('emeth: ' + data.reply, 'a');
    // 감정에 맞는 표정 변경
    if (data.emotion && l2dModel) {
      l2dModel.expression(EMOTION_MAP[data.emotion] ?? 'exp_01');
    }
  }
}

// ── Electron petAPI 콜백 등록 ─────────────────────────────────
if (window.petAPI) {
  window.petAPI.onChatReply(handleReply);
  window.petAPI.onMouseThrough((enabled) => {
    if (enabled) $badge.classList.add('show');
    else         $badge.classList.remove('show');
  });
}

// ── 클릭 vs 드래그 구분 ───────────────────────────────────────
// preload.js의 petAPI.wasDragged()로 드래그 여부를 확인한다.
// petAPI가 없을 때(브라우저 실행)는 단순 이동거리로 판별.
let mdX = 0, mdY = 0;

$cv.addEventListener('mousedown', (e) => {
  mdX = e.clientX; mdY = e.clientY;
});

$cv.addEventListener('click', (e) => {
  // Electron 환경: preload의 드래그 감지 사용
  if (window.petAPI?.wasDragged()) return;
  // 폴백: 이동 거리 5px 이상이면 드래그로 간주
  if (Math.hypot(e.clientX - mdX, e.clientY - mdY) > 5) return;

  if (chatOpen) closeChat();
  else          openChat();
});

// ── 채팅 UI 이벤트 ────────────────────────────────────────────
$send.addEventListener('click', sendChat);
$close.addEventListener('click', closeChat);

$ci.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  if (e.key === 'Escape') closeChat();
});

// 채팅 영역 mousedown이 preload의 드래그로 이어지지 않도록 방지
// (preload는 capture phase에서 #chat-wrap을 이미 제외하므로 이중 방어)
$chatWrap.addEventListener('mousedown', (e) => e.stopPropagation(), true);

// ── 부팅 ─────────────────────────────────────────────────────
initLive2D()
  .then(() => connectWS())
  .catch((e) => {
    console.error('[Pet Boot Error]', e);
    document.body.style.background = '#1a1a2e';
    document.body.innerHTML += `<div style="color:#f76c6c;padding:20px;font:14px monospace;">
      모델 로드 실패: ${e.message}<br>
      FastAPI 서버가 실행 중인지 확인하세요 (포트 8000)
    </div>`;
  });
</script>
</body>
</html>
